name: CI

# Checks every pull request before it is merged, including the bot's weekly
# flake-update PRs: does the flake still evaluate and stay formatted, do the
# hosts still build, and which packages change.
#
# Runs again on master after a merge, which is what deploys Narita, Nikko
# and Ginza: their systems are built and uploaded once more from the merged
# tree, and then published for the hosts to pick up (the last step of the
# build job).
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Evaluates the NixOS configuration and builds the formatting check
  # (nixfmt + keep-sorted).
  check:
    name: Flake check
    # The `secrets` flake input is a private repo, so this needs the deploy
    # key. Secrets aren't available to pull requests from forks: skip those
    # instead of failing halfway.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Load deploy key for the secrets repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_DEPLOY_KEY }}

      - name: nix flake check
        run: nix flake check --print-build-logs

  # Builds each host's full system, and for pull requests also the base
  # branch's, to report what the change does to the installed packages.
  build:
    name: Build ${{ matrix.host }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      # Store path names (regular expressions, matched up to the version)
      # that the NixOS hosts' jobs upload to the cache: what is worth not
      # compiling again, kept short so the bucket stays small. The pull
      # request comment lists what else is built here, with licences, and
      # which of these entries no longer match anything.
      #
      # A package is only downloaded from a cache if everything it refers
      # to can be had as well, so listing one that refers to an unlisted
      # package achieves nothing. That is why nvidia-x11 is here despite
      # its size (1.4 GB for every kernel or driver update): without it
      # nvidia-settings can't be used either and both are built each time,
      # after downloading NVIDIA's installer.
      CACHE_PACKAGES: >-
        [a-z_]+[.]traineddata
        asf-ui
        broadcom-sta
        egl-gbm
        egl-wayland
        egl-wayland2
        egl-x11
        facetimehd
        glibc-locales
        intel-vaapi-driver
        nvidia-settings
        nvidia-x11
        paperless-ngx
        python3[.][0-9]+-ocrmypdf
        tesseract
        unrar
        xwayland
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: Aurora
            os: ubuntu-latest
            attr: nixosConfigurations.Aurora.config.system.build.toplevel
          - host: Tsukuba
            os: ubuntu-latest
            attr: nixosConfigurations.Tsukuba.config.system.build.toplevel
          - host: Kawaguchiko
            os: ubuntu-latest
            attr: nixosConfigurations.Kawaguchiko.config.system.build.toplevel
          - host: Akihabara
            os: ubuntu-latest
            attr: nixosConfigurations.Akihabara.config.system.build.toplevel
          # cache_all: the host can't build its own system (1 GB of memory)
          # and downloads it from the cache instead, so all of it is
          # uploaded, not only the CACHE_PACKAGES entries. Its configuration
          # refuses unfree packages for that reason.
          - host: Narita
            os: ubuntu-latest
            attr: nixosConfigurations.Narita.config.system.build.toplevel
            cache_all: true
          - host: Nikko
            os: ubuntu-latest
            attr: nixosConfigurations.Nikko.config.system.build.toplevel
            cache_all: true
          # The Oracle Arm instance: built on GitHub's Arm runner, and like
          # the micro instances downloads its system from the cache (it
          # can't evaluate its configuration without the secrets repo)
          - host: Ginza
            os: ubuntu-24.04-arm
            attr: nixosConfigurations.Ginza.config.system.build.toplevel
            cache_all: true
          - host: Kawagoe
            os: macos-latest
            attr: darwinConfigurations.Kawagoe.system
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Aurora's system is far bigger than the runner's free disk; this
      # removes preinstalled software and gives the space to /nix. Not on the
      # Arm runner: Ginza's system fits as it is.
      - name: Free disk space
        if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: wimpysworld/nothing-but-nix@v10
        with:
          hatchet-protocol: rampage
          witness-carnage: true
          nix-permission-edict: true

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          # The key signs what the NixOS jobs upload to the cache (empty, so
          # ignored, until the CACHE_* variables are set)
          nix_conf: |
            keep-outputs = true
            ${{ runner.os == 'Linux' && 'build-dir = /nix/build' || '' }}
            extra-trusted-public-keys = ${{ runner.os == 'Linux' && vars.CACHE_PUBLIC_KEY || '' }}

      # The cache is a private bucket, read through its S3 API like the
      # hosts do: credentials where Nix's AWS code looks for them, and the
      # bucket as an extra substituter for every later step. Stops here,
      # before the long build, if the bucket can't be read.
      - name: Set up read access to the cache
        if: runner.os == 'Linux' && vars.CACHE_BUCKET != '' && github.actor != 'dependabot[bot]'
        env:
          CACHE_BUCKET: ${{ vars.CACHE_BUCKET }}
          CACHE_ENDPOINT: ${{ secrets.CACHE_ENDPOINT }}
          CACHE_ACCESS_KEY_ID: ${{ secrets.CACHE_ACCESS_KEY_ID }}
          CACHE_SECRET_ACCESS_KEY: ${{ secrets.CACHE_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          (umask 077 && printf '[default]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
            "$CACHE_ACCESS_KEY_ID" "$CACHE_SECRET_ACCESS_KEY" > ~/.aws/credentials)
          # The secret is a URL (rclone wants one); Nix takes the host name
          endpoint="${CACHE_ENDPOINT#*://}"
          store="s3://${CACHE_BUCKET}?endpoint=${endpoint%/}&region=auto"
          nix store info --store "$store"
          echo "NIX_CONFIG=extra-substituters = $store" >> "$GITHUB_ENV"

      - name: Load deploy key for the secrets repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_DEPLOY_KEY }}

      # Fails here, before the long build, if the bucket's credentials don't
      # allow uploads. The file is the marker every binary cache has.
      - name: Check write access to the cache
        if: runner.os == 'Linux' && vars.CACHE_BUCKET != '' && github.actor != 'dependabot[bot]'
        env:
          CACHE_BUCKET: ${{ vars.CACHE_BUCKET }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.CACHE_ENDPOINT }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.CACHE_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.CACHE_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: true
        run: |
          echo "StoreDir: /nix/store" > "$RUNNER_TEMP/nix-cache-info"
          nix run --inputs-from . nixpkgs#rclone -- copyto \
            "$RUNNER_TEMP/nix-cache-info" "r2:${CACHE_BUCKET}/nix-cache-info"

      # Built first: the new system shares most of its store paths with it,
      # so the second build only fetches and builds what changed.
      - name: Build the base branch's ${{ matrix.host }}
        if: github.event_name == 'pull_request'
        env:
          BASE: github:${{ github.repository }}/${{ github.event.pull_request.base.sha }}
          ATTR: ${{ matrix.attr }}
        run: |
          # A host added by this pull request has nothing to compare with
          if ! nix eval --raw "${BASE}#${ATTR}.drvPath" > /dev/null 2>&1; then
            echo "The base branch has no ${ATTR}; skipping."
            exit 0
          fi
          nix build "${BASE}#${ATTR}" --out-link old-result

      - name: Build ${{ matrix.host }}
        env:
          HOST: ${{ matrix.host }}
          ATTR: ${{ matrix.attr }}
        run: |
          # abort-on-warn: an evaluation warning (a renamed or deprecated
          # option, say) fails the build instead of scrolling past, so the
          # weekly flake update shows it before it becomes an error. Not for
          # the base branch above: that only provides the comparison.
          nix build ".#${ATTR}" --out-link result --print-build-logs --option abort-on-warn true
          echo "${HOST}: \`$(readlink result)\`" >> "$GITHUB_STEP_SUMMARY"

      # Uploads the few packages that have to be compiled, so the next run and
      # the hosts themselves download them instead: the ones named in
      # CACHE_PACKAGES, or everything for a cache_all host.
      - name: Upload compiled packages to the cache
        if: runner.os == 'Linux' && vars.CACHE_BUCKET != '' && github.actor != 'dependabot[bot]'
        env:
          CACHE_ALL: ${{ matrix.cache_all || false }}
          CACHE_BUCKET: ${{ vars.CACHE_BUCKET }}
          CACHE_SIGNING_KEY: ${{ secrets.CACHE_SIGNING_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.CACHE_ENDPOINT }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.CACHE_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.CACHE_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: true
        run: |
          work="$RUNNER_TEMP/cache"
          mkdir -p "$work"
          pattern="^($(printf '%s' "$CACHE_PACKAGES" | tr -s ' ' '|'))(-|\$)"
          if [ "$CACHE_ALL" = true ]; then
            pattern="."
          fi

          # Paths of the new system that cache.nixos.org doesn't have, that
          # match the list (or all of them, for a cache_all host) and aren't
          # in the bucket yet
          nix path-info --recursive --sigs ./result | PATTERN="$pattern" awk '
            /cache\.nixos\.org-1:/ { next }
            {
              name = $1
              sub(/^\/nix\/store\/[a-z0-9]+-/, "", name)
              if (name ~ ENVIRON["PATTERN"]) print $1
            }' > "$work/candidates"
          nix run --inputs-from . nixpkgs#rclone -- lsf --files-only \
            --include '*.narinfo' "r2:${CACHE_BUCKET}" > "$work/present"
          awk '
            FILENAME == ARGV[1] { sub(/\.narinfo$/, ""); present[$0]; next }
            {
              hash = $1
              sub(/^\/nix\/store\//, "", hash); sub(/-.*/, "", hash)
              if (!(hash in present)) print $1
            }' "$work/present" "$work/candidates" > "$work/missing"

          echo "$(wc -l < "$work/candidates") matching, $(wc -l < "$work/missing") to upload"
          if [ ! -s "$work/missing" ]; then
            exit 0
          fi
          head -n 40 "$work/missing"

          # A binary cache only accepts a path together with its dependencies,
          # so the whole closure goes to a local cache first and only the
          # wanted paths are uploaded from there
          (umask 077 && printf '%s\n' "$CACHE_SIGNING_KEY" > "$work/key")
          xargs nix copy \
            --to "file://$work/store?secret-key=$work/key&compression=zstd" \
            < "$work/missing"
          rm "$work/key"

          {
            echo nix-cache-info
            while read -r path; do
              hash="${path#/nix/store/}"
              hash="${hash%%-*}"
              sed -n 's/^URL: //p' "$work/store/${hash}.narinfo"
              echo "${hash}.narinfo"
            done < "$work/missing"
          } > "$work/files"
          nix run --inputs-from . nixpkgs#rclone -- copy --no-traverse \
            --files-from "$work/files" "$work/store" "r2:${CACHE_BUCKET}"

      # After a merge: tells a cache_all host which system to run, by
      # writing the store path to deploy/<host> in the bucket. The host looks
      # there every few minutes and activates what it finds
      # (modules/nixos/self-deploy.nix). Comes after the upload, so the host
      # never sees a system it can't download yet.
      - name: Publish the system for the host to deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.cache_all && vars.CACHE_BUCKET != ''
        env:
          HOST: ${{ matrix.host }}
          CACHE_BUCKET: ${{ vars.CACHE_BUCKET }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.CACHE_ENDPOINT }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.CACHE_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.CACHE_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: true
        run: |
          readlink result | nix run --inputs-from . nixpkgs#rclone -- \
            rcat "r2:${CACHE_BUCKET}/deploy/${HOST}"
          echo "Published for ${HOST}: \`$(readlink result)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Package diff
        if: github.event_name == 'pull_request'
        env:
          HOST: ${{ matrix.host }}
        run: |
          {
            echo "### ${HOST}"
            echo ""
            if [ -e ./old-result ]; then
              echo '```'
              nix run --inputs-from . nixpkgs#nvd -- --color never diff ./old-result ./result
              echo '```'
            else
              echo "New host: the base branch has no system to compare with."
            fi
          } > "diff-${HOST}.md"
          cat "diff-${HOST}.md" >> "$GITHUB_STEP_SUMMARY"

      # Added to the comment: the packages cache.nixos.org doesn't provide,
      # with their licence (scripts/package-licences.nix), so it's clear what
      # CACHE_PACKAGES covers, what could be added to it and which entries
      # are no longer needed.
      - name: Cache report
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        env:
          HOST: ${{ matrix.host }}
          CONFIGURATION: nixosConfigurations.${{ matrix.host }}
          CACHE_ALL: ${{ matrix.cache_all || false }}
        run: |
          work="$RUNNER_TEMP/report"
          mkdir -p "$work"
          jq() { nix run --inputs-from . nixpkgs#jq -- "$@"; }
          pattern="^($(printf '%s' "$CACHE_PACKAGES" | tr -s ' ' '|'))(-|\$)"
          if [ "$CACHE_ALL" = true ]; then
            pattern="."
          fi

          # Every path of the new system that didn't come from
          # cache.nixos.org: "path size derivation"
          nix path-info --recursive --sigs --size ./result \
            | awk '!/cache\.nixos\.org-1:/ { print $1, $2 }' > "$work/paths"
          cut -d' ' -f1 "$work/paths" | xargs nix-store --query --deriver > "$work/derivers"
          paste -d' ' "$work/paths" "$work/derivers" > "$work/table"

          # Of their derivations, the real packages: generated files and
          # wrapper scripts have no pname or are marked as local-only builds.
          # "derivation name pname"
          # shellcheck disable=SC2016
          grep -o '[^ ]*\.drv$' "$work/table" | sort -u | xargs nix derivation show \
            | jq -r '
              (.derivations // .) | to_entries[]
              | ((.value.structuredAttrs // {}) + (.value.env // {})) as $e
              | select(($e.pname // "") != "")
              | select(($e.preferLocalBuild // "") | tostring | test("^(1|true)$") | not)
              | "\(.key | sub(".*/"; "")) \(.value.name) \($e.pname)"' > "$work/packages"

          # Their licences: "derivation<TAB>licences"
          list=$(awk '{ printf "{ drv = \"%s\"; pname = \"%s\"; } ", $1, $3 }' "$work/packages")
          nix eval --json ".#${CONFIGURATION}" \
            --apply "($(cat .github/scripts/package-licences.nix)) [ $list ]" \
            | jq -r 'to_entries[] | "\(.key)\t\(.value)"' > "$work/licences"

          # One row per package, cached ones first, then by name. For a
          # cache_all host only real packages get a row: its generated files
          # are all uploaded and are just counted, on the last line.
          PATTERN="$pattern" LICENCES="$work/licences" awk '
            BEGIN {
              while ((getline line < ENVIRON["LICENCES"]) > 0) {
                split(line, field, "\t")
                licence[field[1]] = field[2]
              }
            }
            NR == FNR { package[$1] = $2; next }
            {
              name = $1; sub(/^\/nix\/store\/[a-z0-9]+-/, "", name)
              drv = $3; sub(/.*\//, "", drv)
              cached = (name ~ ENVIRON["PATTERN"])
              if (drv in package) { name = package[drv]; terms[name] = licence[drv] }
              else if (!cached) next
              else if (ENVIRON["CACHE_ALL"] == "true") { others++; next }
              size[name] += $2
              if (cached) incache[name] = 1
            }
            END {
              for (name in size)
                printf "%d\t%s\t| %s | %.1f MiB | %s | %s |\n", !(name in incache), tolower(name),
                  name, size[name] / 1048576,
                  (name in terms ? terms[name] : "-"), (name in incache ? "yes" : "no")
              printf "9\t~\t%d\n", others
            }' "$work/packages" "$work/table" | LC_ALL=C sort -t "$(printf '\t')" -k1,1n -k2,2 | cut -f3- > "$work/rows"
          others=$(tail -n 1 "$work/rows")
          sed -i '$d' "$work/rows"

          # Collapsed in the comment: the table gets long
          summary="$(wc -l < "$work/rows" | tr -d ' ') packages, $(grep -c '| yes |$' "$work/rows" || true) in cache"
          if [ "$CACHE_ALL" = true ]; then
            summary="$summary, plus $others generated paths, all in cache"
          fi
          {
            echo ""
            echo "<details>"
            echo "<summary>Not on cache.nixos.org: $summary</summary>"
            echo ""
            echo "| Package | Size | Licence | In cache |"
            echo "|---|---:|---|---|"
            cat "$work/rows"
            echo ""
            echo "</details>"
            echo ""
          } > "$work/report.md"
          cat "$work/report.md" >> "diff-${HOST}.md"
          cat "$work/report.md" >> "$GITHUB_STEP_SUMMARY"

          # The CACHE_PACKAGES entries this host doesn't use; the comment job
          # reports the ones no host uses
          sed 's#^/nix/store/[a-z0-9]*-##; s# .*##' "$work/paths" > "$work/names"
          printf '%s\n' "$CACHE_PACKAGES" | tr -s ' ' '\n' | while read -r entry; do
            grep -Eq "^(${entry})(-|\$)" "$work/names" || echo "$entry"
          done > "unused-${HOST}.txt"

      - name: Upload the diff
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: diff-${{ matrix.host }}
          path: |
            diff-${{ matrix.host }}.md
            unused-${{ matrix.host }}.txt
          retention-days: 7

  # One comment on the pull request with every host's diff, updated in place
  # when the PR gets new commits.
  comment:
    name: Comment package diff
    needs: build
    # Also when one host failed to build, so the other's diff still shows
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download the diffs
        uses: actions/download-artifact@v8
        with:
          pattern: diff-*
          merge-multiple: true

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- ci-package-diff -->'
          {
            echo "$marker"
            echo "## Package diff"
            echo ""
            if ls diff-*.md > /dev/null 2>&1; then
              cat diff-*.md
            else
              echo "No diff was produced: the builds failed before finishing."
            fi
            echo ""
            # Entries of the cache allowlist that every reporting host lists
            # as unused
            set -- unused-*.txt
            if [ -e "$1" ]; then
              # shellcheck disable=SC2016
              unused=$(sort "$@" | uniq -c | awk -v hosts="$#" '$1 == hosts { printf " `%s`", $2 }')
              if [ -n "$unused" ]; then
                echo "Entries in \`CACHE_PACKAGES\` that match nothing on any host:$unused"
                echo ""
              fi
            fi
            echo "[Workflow run]($RUN_URL)"
          } > body.md

          # Update the existing comment if there is one, otherwise create it
          id=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\"))] | first | .id // empty")
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${id}" -F body=@body.md > /dev/null
          else
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" -F body=@body.md > /dev/null
          fi
