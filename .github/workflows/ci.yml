name: CI

# Checks every pull request before it is merged, including the bot's weekly
# flake-update PRs: does the flake still evaluate and stay formatted, do both
# hosts still build, and which packages change.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Evaluates the NixOS configuration and builds the formatting check
  # (nixfmt + keep-sorted).
  check:
    name: Flake check
    # The `secrets` flake input is a private repo, so this needs the deploy
    # key. Secrets aren't available to pull requests from forks: skip those
    # instead of failing halfway.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Load deploy key for the secrets repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_DEPLOY_KEY }}

      - name: nix flake check
        run: nix flake check --print-build-logs

  # Builds each host's full system, and for pull requests also the base
  # branch's, to report what the change does to the installed packages.
  build:
    name: Build ${{ matrix.host }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: Aurora
            os: ubuntu-latest
            attr: nixosConfigurations.Aurora.config.system.build.toplevel
          - host: Kawagoe
            os: macos-latest
            attr: darwinConfigurations.Kawagoe.system
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Aurora's system is far bigger than the runner's free disk; this
      # removes preinstalled software and gives the space to /nix.
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: wimpysworld/nothing-but-nix@v10
        with:
          hatchet-protocol: rampage
          witness-carnage: true
          nix-permission-edict: true

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          # The extra substituter is the cache the Aurora job uploads to
          # (empty, so ignored, until the CACHE_* variables are set)
          nix_conf: |
            keep-outputs = true
            ${{ runner.os == 'Linux' && 'build-dir = /nix/build' || '' }}
            extra-substituters = ${{ matrix.host == 'Aurora' && vars.CACHE_URL || '' }}
            extra-trusted-public-keys = ${{ matrix.host == 'Aurora' && vars.CACHE_PUBLIC_KEY || '' }}

      - name: Load deploy key for the secrets repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_DEPLOY_KEY }}

      # Built first: the new system shares most of its store paths with it,
      # so the second build only fetches and builds what changed.
      - name: Build the base branch's ${{ matrix.host }}
        if: github.event_name == 'pull_request'
        env:
          BASE: github:${{ github.repository }}/${{ github.event.pull_request.base.sha }}
          ATTR: ${{ matrix.attr }}
        run: nix build "${BASE}#${ATTR}" --out-link old-result --fallback

      - name: Build ${{ matrix.host }}
        env:
          ATTR: ${{ matrix.attr }}
        run: nix build ".#${ATTR}" --out-link result --fallback --print-build-logs

      # Uploads the few packages that have to be compiled, so the next run and
      # Aurora itself download them instead. The bucket is public: only
      # packages named in CACHE_PATTERN go in, never the unfree ones.
      - name: Upload compiled packages to the cache
        if: matrix.host == 'Aurora' && vars.CACHE_BUCKET != '' && github.actor != 'dependabot[bot]'
        env:
          CACHE_PATTERN: ^(paperless-ngx|python3[.][0-9]+-ocrmypdf|tesseract|[a-z_]+[.]traineddata|xwayland|asf-ui|glibc-locales)(-|$)
          CACHE_URL: ${{ vars.CACHE_URL }}
          CACHE_BUCKET: ${{ vars.CACHE_BUCKET }}
          CACHE_SIGNING_KEY: ${{ secrets.CACHE_SIGNING_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: ${{ vars.CACHE_ENDPOINT }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.CACHE_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.CACHE_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: true
        run: |
          work="$RUNNER_TEMP/cache"
          mkdir -p "$work"

          # Paths of the new system that cache.nixos.org doesn't have, that
          # match the pattern and aren't in the bucket yet
          nix path-info --recursive --sigs ./result | awk '
            /cache\.nixos\.org-1:/ { next }
            {
              name = $1
              sub(/^\/nix\/store\/[a-z0-9]+-/, "", name)
              if (name ~ ENVIRON["CACHE_PATTERN"]) print $1
            }' > "$work/candidates"
          while read -r path; do
            hash="${path#/nix/store/}"
            hash="${hash%%-*}"
            curl --fail --silent --head --output /dev/null "${CACHE_URL%/}/${hash}.narinfo" \
              || echo "$path"
          done < "$work/candidates" > "$work/missing"

          echo "$(wc -l < "$work/candidates") matching, $(wc -l < "$work/missing") to upload"
          if [ ! -s "$work/missing" ]; then
            exit 0
          fi
          cat "$work/missing"

          # A binary cache only accepts a path together with its dependencies,
          # so the whole closure goes to a local cache first and only the
          # wanted paths are uploaded from there
          (umask 077 && printf '%s\n' "$CACHE_SIGNING_KEY" > "$work/key")
          xargs nix copy \
            --to "file://$work/store?secret-key=$work/key&compression=zstd" \
            < "$work/missing"
          rm "$work/key"

          {
            echo nix-cache-info
            while read -r path; do
              hash="${path#/nix/store/}"
              hash="${hash%%-*}"
              sed -n 's/^URL: //p' "$work/store/${hash}.narinfo"
              echo "${hash}.narinfo"
            done < "$work/missing"
          } > "$work/files"
          nix run --inputs-from . nixpkgs#rclone -- copy --no-traverse \
            --files-from "$work/files" "$work/store" "r2:${CACHE_BUCKET}"

      - name: Package diff
        if: github.event_name == 'pull_request'
        env:
          HOST: ${{ matrix.host }}
        run: |
          {
            echo "### ${HOST}"
            echo ""
            echo '```'
            nix run --inputs-from . nixpkgs#nvd -- --color never diff ./old-result ./result
            echo '```'
          } > "diff-${HOST}.md"
          cat "diff-${HOST}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the diff
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: diff-${{ matrix.host }}
          path: diff-${{ matrix.host }}.md
          retention-days: 7

  # One comment on the pull request with both hosts' diffs, updated in place
  # when the PR gets new commits.
  comment:
    name: Comment package diff
    needs: build
    # Also when one host failed to build, so the other's diff still shows
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download the diffs
        uses: actions/download-artifact@v8
        with:
          pattern: diff-*
          merge-multiple: true

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- ci-package-diff -->'
          {
            echo "$marker"
            echo "## Package diff"
            echo ""
            if ls diff-*.md > /dev/null 2>&1; then
              cat diff-*.md
            else
              echo "No diff was produced: the builds failed before finishing."
            fi
            echo ""
            echo "[Workflow run]($RUN_URL)"
          } > body.md

          # Update the existing comment if there is one, otherwise create it
          id=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\"))] | first | .id // empty")
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${id}" -F body=@body.md > /dev/null
          else
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" -F body=@body.md > /dev/null
          fi
