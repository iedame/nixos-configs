name: Nix Flake Update

on:
  schedule:
    # Twice a week, so each update is smaller and a breakage is easier to
    # place; nixos-unstable only moves once Hydra has built it, so updating
    # sooner doesn't mean building more
    - cron: "0 0 * * 2,5" # Midnight UTC on Tuesdays and Fridays
  workflow_dispatch: # Allow manual triggering

# The job's own token only reads the repository; the branch and pull request
# are created with a short-lived token from the bot's GitHub App (below).
permissions:
  contents: read

jobs:
  update-flake:
    runs-on: ubuntu-latest
    steps:
      # A GitHub App acts as the bot, so update PRs are opened by
      # `<app-name>[bot]` instead of by me: I get notified, and the PRs
      # trigger other workflows (which PRs opened with GITHUB_TOKEN don't).
      # Needs the app installed on this repository, with Contents and Pull
      # requests set to read & write, plus:
      #   - repository variable BOT_CLIENT_ID   (the app's Client ID)
      #   - repository secret   BOT_PRIVATE_KEY (a private key generated for it)
      - name: Get a token for the bot
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Work out the bot's commit identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          SLUG: ${{ steps.bot-token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}[bot]" --jq .id)
          echo "identity=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-outputs = true

      # The `secrets` flake input is a private repo fetched over SSH; this
      # loads a read-only deploy key for it (repo secret SECRETS_DEPLOY_KEY)
      - name: Load deploy key for the secrets repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_DEPLOY_KEY }}

      - name: Update flake inputs
        run: |
          # nix flake update updates every input and prints the per-input
          # lock changes to stderr; capture them for the PR body.
          nix flake update 2>&1 | tee /tmp/flake-update.log

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet flake.lock; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate update summary
        if: steps.check_changes.outputs.has_changes == 'true'
        id: summary
        run: |
          {
            echo "## Flake inputs updated"
            echo ""
            echo "Automated \`nix flake update\` (Tuesdays and Fridays) — refreshes all inputs."
            echo ""
            echo "### Changes:"
            echo '```'
            # Keep only the lock changes ("• Updated input ..." and the two
            # indented lines under each), not fetch progress or warnings
            grep -E "^(• |    '|  → )" /tmp/flake-update.log
            echo '```'
          } > /tmp/pr_body.md
          cat /tmp/pr_body.md >> "$GITHUB_STEP_SUMMARY"

      # One rolling branch: if the previous run's PR is still open, it is updated
      # in place instead of a second PR being opened. The review request
      # notifies me whatever my watch setting for the repository is.
      - name: Create pull request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.bot-token.outputs.token }}
          author: ${{ steps.bot.outputs.identity }}
          committer: ${{ steps.bot.outputs.identity }}
          commit-message: "chore: flake update - ${{ steps.bot.outputs.date }}"
          title: "chore: flake update - ${{ steps.bot.outputs.date }}"
          body-path: /tmp/pr_body.md
          branch: automated/flake-update
          base: master
          delete-branch: true
          reviewers: iedame

      - name: No changes
        if: steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "No flake input updates available"
